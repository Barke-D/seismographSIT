
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT - Digital Seismograph Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Poppins:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              sit: {
                daintree: '#02272F',
                orange: '#F15A24',
                halfbaked: '#8AC4C7',
                lightblue: '#CFDFDC',
                yellow: '#EEBE41',
                lightyellow: '#EAE4D2',
              }
            },
            fontFamily: {
              title: ['Outfit', 'sans-serif'],
              sans: ['Poppins', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          }
        }
      }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            background-color: #CFDFDC; /* SIT Light Blue as baseline */
            transition: background-color 0.3s ease;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #8AC4C7;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #F15A24;
        }
        sub, sup {
          font-size: 75%;
          line-height: 0;
          position: relative;
          vertical-align: baseline;
        }
        sup { top: -0.5em; }
        sub { bottom: -0.25em; }
    </style>
<script type="importmap">

  }
}
</script>

</head>

</html>
